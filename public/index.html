<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2Poli.TO — study portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%2315130f%22/%3E%3Crect x=%223%22 y=%224%22 width=%222%22 height=%228%22 fill=%22%23ede8dc%22/%3E%3Crect x=%227%22 y=%224%22 width=%222%22 height=%228%22 fill=%22%23ff4f1f%22/%3E%3Crect x=%2211%22 y=%224%22 width=%222%22 height=%228%22 fill=%22%23ede8dc%22/%3E%3C/svg%3E" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#/" class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">2Poli.TO</span>
    </a>
    <div class="topbar-meta mono">
      <span id="crumb">/ panel</span>
      <span class="link-state" id="linkState"><span class="led"></span><span id="linkText">checking</span></span>
    </div>
  </header>

  <main id="app"></main>

  <template id="tpl-home">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow mono">PoliTo · study network · prototype</p>
        <h1>Every course is a <em>port.</em><br />Plug in and start learning.</h1>
        <p class="lede">A tutor that reads your professor's material, and an archive of past exams — one course at a time. Computer Networks is live; the rest come online soon.</p>
      </div>
      <svg class="hero-topo" viewBox="0 0 420 300" aria-hidden="true">
        <g class="topo-links">
          <path id="l1" d="M60 70 L200 50 L340 90" />
          <path id="l2" d="M60 70 L130 190 L260 220 L340 90" />
          <path id="l3" d="M200 50 L130 190" />
          <path d="M200 50 L260 220" />
          <path d="M260 220 L380 250" />
          <path d="M130 190 L40 250" />
        </g>
        <circle r="4" class="pkt"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#l1" /></animateMotion></circle>
        <circle r="4" class="pkt pkt-b"><animateMotion dur="4.6s" repeatCount="indefinite" begin="-1.5s"><mpath href="#l2" /></animateMotion></circle>
        <circle r="3" class="pkt"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-.7s"><mpath href="#l3" /></animateMotion></circle>
        <g class="topo-nodes">
          <rect x="48" y="58" width="24" height="24" /><rect x="188" y="38" width="24" height="24" class="hub" />
          <rect x="328" y="78" width="24" height="24" /><rect x="118" y="178" width="24" height="24" />
          <rect x="248" y="208" width="24" height="24" /><circle cx="380" cy="250" r="7" /><circle cx="40" cy="250" r="7" />
        </g>
        <g class="topo-labels mono"><text x="48" y="50">R1</text><text x="188" y="30">CORE</text><text x="330" y="70">R2</text><text x="96" y="222">R3</text><text x="250" y="246">R4</text></g>
      </svg>
    </section>

    <section class="panel">
      <div class="panel-head mono">
        <span>PATCH PANEL — <b id="portCount"></b> PORTS</span>
        <span class="panel-legend"><span><i class="led on"></i>link up</span><span><i class="led"></i>no carrier</span></span>
      </div>
      <div class="ports" id="ports"></div>
    </section>

    <footer class="foot mono">
      <span>built by students, for students · not an official Politecnico di Torino service</span>
      <span id="modelInfo"></span>
    </footer>
  </template>

  <template id="tpl-course">
    <section class="course">
      <aside class="rail">
        <a href="#/" class="back mono">← panel</a>
        <p class="eyebrow mono" id="courseTag"></p>
        <h2 id="courseName"></h2>
        <p class="rail-blurb" id="courseBlurb"></p>

        <nav class="tabs" role="tablist">
          <button class="tab" data-tab="tutor" role="tab"><span class="mono">01</span>Tutor<small>ask anything, cited from the slides</small></button>
          <button class="tab" data-tab="exams" role="tab"><span class="mono">02</span>Past questions<small>exam simulation &amp; topic practice</small></button>
          <button class="tab" data-tab="forge" role="tab"><span class="mono">03</span>Question forge<small>generate new questions from past exams</small></button>
          <button class="tab" data-tab="analysis" role="tab"><span class="mono">04</span>Exam analysis<small>upload your exam PDF, get your grade /30</small></button>
          <button class="tab" data-tab="cards" role="tab"><span class="mono">05</span>Flashcards<small>spaced repetition for the facts that matter</small></button>
        </nav>

        <div class="materials">
          <div class="materials-head">
            <span class="mono">MATERIAL</span>
            <span class="mono mat-status" id="matStatus">—</span>
          </div>
          <ul class="mat-list" id="matList"></ul>
          <label class="drop" id="drop">
            <input type="file" id="fileInput" multiple accept=".pdf,.md,.txt" hidden />
            <span>Drop PDF / MD / TXT<br /><u>or browse</u></span>
          </label>
          <button class="btn-ghost mono" id="reindex">↻ re-index</button>
        </div>
      </aside>

      <div class="stage">
        <div class="view" data-view="tutor">
          <div class="chat" id="chat"></div>
          <form class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Ask about the course — e.g. why does TCP halve cwnd on 3 dup ACKs?"></textarea>
            <div class="composer-row">
              <span class="mono hint">⏎ send · ⇧⏎ new line</span>
              <div class="composer-actions">
                <button type="button" class="btn-ghost mono" id="clearChat">clear</button>
                <button type="submit" class="btn-send" id="send"><span>Transmit</span><svg viewBox="0 0 20 20"><path d="M3 10h12M11 5l5 5-5 5" /></svg></button>
              </div>
            </div>
          </form>
        </div>

        <div class="view" data-view="exams">
          <div class="quiz" id="quiz"></div>
        </div>

        <div class="view" data-view="forge">
          <div class="quiz" id="forge"></div>
        </div>

        <div class="view" data-view="analysis">
          <div class="quiz" id="analysis"></div>
        </div>

        <div class="view" data-view="cards">
          <div class="quiz" id="cards"></div>
        </div>
      </div>
    </section>
  </template>

  <div class="toast mono" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
